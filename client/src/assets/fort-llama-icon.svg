<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 4px pixel grid throughout for crisp scaling -->

  <!-- Background: sky blue with rounded corners -->
  <rect width="64" height="64" rx="6" fill="#87CEEB"/>

  <!-- Cloud wisps -->
  <ellipse cx="12" cy="10" rx="10" ry="3" fill="white" opacity="0.4"/>
  <ellipse cx="52" cy="7" rx="8" ry="2.5" fill="white" opacity="0.3"/>

  <!-- Ground -->
  <rect x="0" y="52" width="64" height="12" rx="0" fill="#5a8a4a"/>
  <rect x="0" y="52" width="64" height="2" fill="#6b9b58"/>
  <!-- Clip ground corners to match outer radius -->
  <rect x="0" y="58" width="6" height="6" fill="#87CEEB"/>
  <rect x="58" y="58" width="6" height="6" fill="#87CEEB"/>
  <rect x="0" y="58" width="64" height="6" rx="6" fill="#5a8a4a"/>

  <!-- ===== CASTLE ===== -->

  <!-- Left turret -->
  <rect x="6" y="16" width="4" height="4" fill="#4a4a4a"/>
  <rect x="12" y="16" width="4" height="4" fill="#4a4a4a"/>
  <rect x="6" y="20" width="10" height="32" fill="#3a3a3a"/>
  <rect x="6" y="20" width="10" height="2" fill="#4a4a4a"/>
  <!-- Arrow slit -->
  <rect x="10" y="28" width="2" height="8" fill="#282828"/>

  <!-- Right turret -->
  <rect x="48" y="16" width="4" height="4" fill="#4a4a4a"/>
  <rect x="54" y="16" width="4" height="4" fill="#4a4a4a"/>
  <rect x="48" y="20" width="10" height="32" fill="#3a3a3a"/>
  <rect x="48" y="20" width="10" height="2" fill="#4a4a4a"/>
  <!-- Arrow slit -->
  <rect x="52" y="28" width="2" height="8" fill="#282828"/>

  <!-- Central wall -->
  <rect x="16" y="24" width="32" height="28" fill="#303030"/>
  <rect x="16" y="24" width="32" height="2" fill="#4a4a4a"/>
  <!-- Wall battlements -->
  <rect x="18" y="18" width="4" height="6" fill="#4a4a4a"/>
  <rect x="26" y="18" width="4" height="6" fill="#4a4a4a"/>
  <rect x="34" y="18" width="4" height="6" fill="#4a4a4a"/>
  <rect x="42" y="18" width="4" height="6" fill="#4a4a4a"/>

  <!-- Gate -->
  <rect x="27" y="36" width="10" height="16" fill="#282828"/>
  <rect x="25" y="34" width="14" height="2" fill="#4a4a4a"/>
  <rect x="27" y="32" width="10" height="2" fill="#4a4a4a"/>
  <!-- Portcullis -->
  <rect x="30" y="36" width="1" height="16" fill="#585858" opacity="0.5"/>
  <rect x="34" y="36" width="1" height="16" fill="#585858" opacity="0.5"/>
  <rect x="27" y="42" width="10" height="1" fill="#585858" opacity="0.5"/>

  <!-- Gold accent banners on wall -->
  <rect x="18" y="28" width="8" height="2" fill="#D4A035" opacity="0.7"/>
  <rect x="38" y="28" width="8" height="2" fill="#D4A035" opacity="0.7"/>

  <!-- Left flag -->
  <rect x="10" y="6" width="2" height="10" fill="#585858"/>
  <rect x="12" y="6" width="6" height="2" fill="#D4A035"/>
  <rect x="12" y="8" width="4" height="2" fill="#E8B84A"/>
  <rect x="12" y="10" width="2" height="2" fill="#D4A035"/>

  <!-- Right flag -->
  <rect x="52" y="6" width="2" height="10" fill="#585858"/>
  <rect x="46" y="6" width="6" height="2" fill="#d475a8"/>
  <rect x="48" y="8" width="4" height="2" fill="#e088b8"/>
  <rect x="50" y="10" width="2" height="2" fill="#d475a8"/>

  <!-- ===== LLAMA (foreground, overlapping gate) ===== -->

  <!-- Ears -->
  <rect x="27" y="26" width="2" height="6" fill="#e6e2dc"/>
  <rect x="35" y="26" width="2" height="6" fill="#e6e2dc"/>
  <!-- Ear inner -->
  <rect x="27.5" y="28" width="1" height="3" fill="#d475a8" opacity="0.5"/>
  <rect x="35.5" y="28" width="1" height="3" fill="#d475a8" opacity="0.5"/>

  <!-- Head -->
  <rect x="27" y="32" width="10" height="6" fill="#e6e2dc"/>
  <!-- Eyes -->
  <rect x="29" y="34" width="2" height="2" fill="#282828"/>
  <rect x="33" y="34" width="2" height="2" fill="#282828"/>
  <!-- Eye shine -->
  <rect x="29.5" y="34.5" width="1" height="1" fill="white" opacity="0.8"/>
  <rect x="33.5" y="34.5" width="1" height="1" fill="white" opacity="0.8"/>

  <!-- Neck -->
  <rect x="29" y="38" width="6" height="4" fill="#e6e2dc"/>

  <!-- Body -->
  <rect x="23" y="42" width="18" height="10" fill="#e6e2dc"/>
  <!-- Belly shade -->
  <rect x="25" y="46" width="14" height="4" fill="#d4c8b8" opacity="0.4"/>

  <!-- Golden saddle blanket -->
  <rect x="25" y="42" width="14" height="2" fill="#D4A035"/>
  <rect x="27" y="42" width="2" height="2" fill="#E8B84A"/>
  <rect x="33" y="42" width="2" height="2" fill="#E8B84A"/>

  <!-- Tail -->
  <rect x="20" y="44" width="3" height="3" fill="#e6e2dc"/>
  <rect x="18" y="42" width="2" height="4" fill="#d4c8b8"/>

  <!-- Legs -->
  <rect x="25" y="52" width="3" height="4" fill="#d4c8b8"/>
  <rect x="30" y="52" width="3" height="4" fill="#e6e2dc"/>
  <rect x="35" y="52" width="3" height="4" fill="#d4c8b8"/>
  <rect x="25" y="55" width="3" height="1" fill="#9c9894"/>
  <rect x="30" y="55" width="3" height="1" fill="#9c9894"/>
  <rect x="35" y="55" width="3" height="1" fill="#9c9894"/>

  <!-- Golden border accent -->
  <rect x="0" y="0" width="64" height="64" rx="6" fill="none" stroke="#D4A035" stroke-width="2"/>
</svg>
